# /etc/turnserver.conf
# 대문자 값(PUBLIC_IP, PRIVATE_IP, DOMAIN, TURN_SECRET)을 실제 값으로 바꾸세요.

listening-port=3478
# EC2는 공인 IP와 내부 IP가 다르므로 "공인IP/내부IP" 형식으로 지정
external-ip=PUBLIC_IP/PRIVATE_IP
realm=DOMAIN

# 백엔드 .env 의 TURN_SECRET 과 같은 값 (임시 자격 증명 방식)
use-auth-secret
static-auth-secret=TURN_SECRET

# 릴레이에 쓸 UDP 포트 범위 (보안 그룹에서도 같은 범위를 열어야 함)
min-port=49160
max-port=49200

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
log-file=/var/log/turnserver.log
simple-log
